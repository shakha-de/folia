name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_API_VERSION: "1.44"
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_CHECKS_DISABLE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Build and test
        working-directory: server
        run: ./mvnw -B clean test -Ddocker.api.version=1.44
