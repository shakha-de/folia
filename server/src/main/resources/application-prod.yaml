spring:
  application:
    name: server

  messages:
    encoding: UTF-8

  # ===========================
  # Database Configuration (Neon)
  # ===========================
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://${NEON_DATABASE}}"
    username: "${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}"
    password: "${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}"

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      initialization-fail-timeout: 0
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jdbc:
        lob:
          non_textual_creation: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
      enabled: true
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

application:
  security:
    jwt:
      secret-key: "${JWT_SECRET}"
      expiration: ${JWT_EXPIRATION:86400000}       # 1 Tag
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 Tage

logging:
  level:
    org.springframework: WARN
    com.folia: INFO

