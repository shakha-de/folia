spring:
  application:
    name: server

  messages:
    encoding: UTF-8


  # ===========================
  # Database Configuration
  # ===========================
  datasource:
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"

    # Connection Pool
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
      jdbc:
        lob:
          non_textual_creation: true
    show-sql: true

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
      enabled: true
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

application:
  security:
    jwt:
      secret-key: "${JWT_SECRET:dev-secret-change-me-please-change-me-please}"
      expiration: ${JWT_EXPIRATION:3600000}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.178.203:3000}"

logging:
    level:
        org.springframework: DEBUG

